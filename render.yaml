services:
  - type: web
    name: 9k-portal
    runtime: node
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: 9k-portal-db
          property: connectionString
      - key: PORTAL_URL
        sync: false
      # Set in the Render dashboard — used once to seed the first admin login
      # (admin@9ksystems.net). Without it, admin seeding is skipped in production.
      - key: ADMIN_SEED_PASSWORD
        sync: false

databases:
  - name: 9k-portal-db
    plan: starter
